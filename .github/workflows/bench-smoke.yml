name: Benchmark Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bench-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luamark
        run: luarocks install luamark

      - name: Benchmark smoke check
        run: npm run bench
        env:
          LUA_51: lua
