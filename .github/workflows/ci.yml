name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check (lint + format)
        run: npm run check

      - name: Check markdown
        run: npm run check:md

      - name: Typecheck
        run: |
          if find src -name '*.ts' 2>/dev/null | grep -q .; then
            npm run typecheck
          fi

      - name: Type-aware lint
        run: npm run check:typelint

      - name: Fallow audit
        run: npm run check:fallow

      - name: Spell check
        run: npm run check:spelling

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Build
        run: npm run build

      - name: Fallow
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          gate: new-only
          health-baseline: fallow-baselines/health.json
          dupes-baseline: fallow-baselines/dupes.json
          fail-on-issues: true

      - name: Check package
        run: npm run check:package

      - name: Test
        run: npm run test:unit

      - name: Cache TSTL conformance clone
        uses: actions/cache@v6
        with:
          path: .conformance
          key: conformance-${{ hashFiles('scripts/conformance.ts', 'scripts/conformance.patch') }}

      - name: Check examples in sync
        run: npm run examples:check

      - name: Conformance tests
        run: npm run test:conformance
