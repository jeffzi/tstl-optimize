name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check (lint + format)
        run: npm run check

      - name: Check markdown
        run: npm run check:md

      - name: Typecheck
        run: |
          if find src -name '*.ts' 2>/dev/null | grep -q .; then
            npm run typecheck
          fi

      - name: Check unused
        run: npm run check:unused

      - name: Install Lua
        uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "5.1"

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:unit

      - name: Cache TSTL conformance clone
        uses: actions/cache@v4
        with:
          path: .conformance
          key: conformance-${{ hashFiles('scripts/conformance.ts', 'scripts/conformance.patch') }}

      - name: Check examples in sync
        run: npm run examples:check

      - name: Conformance tests
        run: npm run test:conformance
