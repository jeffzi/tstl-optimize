pre-commit:
  commands:
    check:
      glob: "**/*.{ts,js,json}"
      run: npx biome check --write --error-on-warnings --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    dprint:
      glob: "**/*.md"
      run: npx dprint fmt {staged_files}
      stage_fixed: true
    markdownlint:
      glob: "**/*.md"
      run: npx markdownlint-cli2 {staged_files} --fix
      stage_fixed: true
    typecheck:
      glob: "**/*.ts"
      run: npm run typecheck
    typelint:
      glob: "{src,scripts}/**/*.ts"
      run: npx oxlint --type-aware src scripts
    fallow:
      glob: "**/*.{ts,js,json}"
      run: npx fallow audit --quiet
    spelling:
      glob: "**/*.{ts,md}"
      run: npx cspell --no-progress --no-summary {staged_files}
    package:
      glob: "package.json"
      run: npx publint --level error && npx attw --pack . --ignore-rules cjs-only-exports-default no-resolution --quiet
    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    build:
      glob: "src/**/*.ts"
      run: npm run build
    test:
      glob: "src/**/*.ts"
      run: npm test
    examples:
      glob: "{src/**/*.ts,examples/**/*.ts}"
      run: npm run examples:check
