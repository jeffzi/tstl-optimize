pre-commit:
  commands:
    check:
      glob: "**/*.{ts,js,json}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    dprint:
      glob: "**/*.md"
      run: npx dprint fmt {staged_files}
      stage_fixed: true
    markdownlint:
      glob: "**/*.md"
      run: npx markdownlint-cli2 {staged_files} --fix
      stage_fixed: true
    typecheck:
      glob: "**/*.ts"
      run: npx tsc --noEmit
    unused:
      glob: "**/*.{ts,js,json}"
      run: npx knip --no-progress

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    build:
      glob: "src/**/*.ts"
      run: npm run build
    test:
      glob: "src/**/*.ts"
      run: npm test
